name: Visual Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-regression:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npm run test:e2e:install

    - name: Build application
      run: npm run build

    - name: Run visual regression tests
      env:
        BASE_URL: http://localhost:5175
        CI: true
        UPDATE_SNAPSHOTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
          npm run test:e2e:update-snapshots
        else
          npm run test:e2e -- --grep "@visual" --reporter=json --output-file=test-results/visual-results.json
        fi

    - name: Upload visual results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: visual-test-results
        path: |
          test-results/visual-results.json
          test-results/
        retention-days: 7

    - name: Comment on visual differences
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🎨 **Visual Regression Tests Failed**\n\nVisual differences were detected. Please review the test results and update snapshots if the changes are intentional.'
          });