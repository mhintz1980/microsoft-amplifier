[project]
name = "workspace"
version = "0.1.0"
description = "Workspace project"
requires-python = ">=3.11"
dependencies = [
    "agentlightning>=0.1.2",
    "aiohttp>=3.12.15",
    "anthropic>=0.69.0",
    "beautifulsoup4>=4.14.2",
    "chromadb>=1.3.0",
    "claude-code-sdk>=0.0.20",
    "click>=8.2.1",
    "faiss-cpu>=1.12.0",
    "fastapi>=0.120.4",
    "httpx>=0.28.1",
    "langchain>=0.2.1",
    "langchain-community>=0.3.31",
    "langchain-openai>=0.3.28",
    "markdownify>=1.2.0",
    "mcp-server-sqlite>=2025.4.25",
    "networkx>=3.5",
    "nltk>=3.9.2",
    "numpy>=2.3.4",
    "openai>=1.108.1",
    "opencv-python>=4.11.0.86",
    "pdfplumber>=0.11.7",
    "plotly>=6.3.1",
    "prometheus-client>=0.23.1",
    "pydantic>=2.11.7",
    "pydantic-ai>=1.0.10",
    "pydantic-settings>=2.10.1",
    "pydot>=4.0.1",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.13.0",
    "requests>=2.32.4",
    "rich>=14.1.0",
    "schedule>=1.2.2",
    "scipy>=1.16.3",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.51.0",
    "structlog>=25.5.0",
    "tiktoken>=0.11.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.36.0",
    "yt-dlp>=2025.9.26",
]

[tool.uv.workspace]
# Add all projects in the workspace
members = []

[tool.uv.sources]
# Example: my-project = { workspace = true }

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "debugpy>=1.8.14",
    "pyright>=1.1.406",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.10",
    "twine>=6.1.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    ".venv/**",
    "scenarios/**",
    "scenarios/*/.venv/**",
    "node_modules/**",
    ".git/**",
    ".ruff_cache/**",
    ".pytest_cache/**",
    "*.egg-info",
    "build/**",
    "dist/**",
    ".data/**",
    "ai_working/**",
    "Skill_Seekers/**",
    "skill_seekers_env/**",
    "agent_lightning_fresh/**",
]
typeCheckingMode = "basic"
reportMissingImports = false
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--ignore=Skill_Seekers",
    "--ignore=skill_seekers_env",
]
asyncio_mode = "auto"
